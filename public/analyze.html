<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>真一 · 命例分析</title>
  <style>
    :root{font-family:"Noto Serif SC","Songti SC",serif;color:#efe6d5;background:#141414}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#392d1d 0,#141414 45%)}
    header,main{width:min(900px,calc(100% - 36px));margin:auto}
    header{display:flex;justify-content:space-between;align-items:center;padding:28px 0;border-bottom:1px solid #7c6746}
    header b{font-size:20px;letter-spacing:.15em;color:#d9b778}
    a{color:#d9b778;text-decoration:none}
    main{padding:44px 0 80px}
    small{color:#c5a46e;letter-spacing:.2em}
    h1{font-size:clamp(28px,5vw,44px);font-weight:500;margin:12px 0}
    .lead{line-height:1.8;color:#c9c0b1;margin-bottom:30px}
    label{display:block;margin:0 0 12px;color:#e4c895}
    textarea{width:100%;min-height:210px;resize:vertical;border:1px solid #776749;border-radius:12px;background:#211e1a;color:#f8f1e4;padding:18px;font:16px/1.8 inherit}
    textarea:focus{outline:2px solid #caa56b}
    .actions{display:flex;align-items:center;gap:20px;margin:18px 0 32px}
    button{padding:13px 32px;border:1px solid #d9b778;border-radius:8px;background:#c6a269;color:#17130e;font:600 16px inherit;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    #status{color:#c9c0b1;line-height:1.6}
    .result{border:1px solid #67583f;border-radius:14px;background:#201c18;padding:24px;min-height:120px}
    .result h2{margin:0 0 14px;font-size:20px;color:#e4c895}
    #pillars{color:#d1b880;margin-bottom:15px}
    #answer{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;margin:0;font:16px/1.9 inherit}
    .hint{font-size:14px;color:#a99d89;line-height:1.7}
  </style>
</head>
<body>
  <header><b>真一 · ZHENYI</b><a href="./index.html">打开专业排盘 →</a></header>
  <main>
    <small>命例自动排盘与分析</small>
    <h1>发来命例，真一为你推演</h1>
    <p class="lead">写明乾造或坤造，并按年、月、日、时顺序给出四柱。已有出生资料的命例也可先到专业排盘页录入，再从结果页提问。</p>
    <label for="question">命例与问题</label>
    <textarea id="question" placeholder="例如：乾造 甲子 甲戌 戊寅 庚申。请先说命局做功，再分析事业。"></textarea>
    <div class="actions"><button id="submit" type="button">发送命例</button><span id="status" role="status"></span></div>
    <section class="result" aria-live="polite"><h2>真一分析</h2><div id="pillars"></div><p id="answer">排盘与模型分析结果会显示在这里。</p></section>
    <p class="hint">四柱由本地排盘程序重新校验；未提供性别或起运资料时，不会补造具体大运应期。</p>
  </main>
  <script>
    const button=document.getElementById('submit'),status=document.getElementById('status'),answer=document.getElementById('answer'),pillars=document.getElementById('pillars'),question=document.getElementById('question');
    async function send(){
      const value=question.value.trim();if(!value){status.textContent='请先输入命例';question.focus();return}
      button.disabled=true;status.textContent='正在排盘并分析…';answer.textContent='';pillars.textContent='';
      try{
        const response=await fetch('./api/ai/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:value})});
        const result=await response.json();if(!result.ok)throw new Error(result.message||'分析失败');
        const p=result.data.chart?.four_pillars||{};pillars.textContent=[p.year,p.month,p.day,p.hour].filter(Boolean).join('  ·  ');
        answer.textContent=result.data.answer;status.textContent='分析完成';
      }catch(error){answer.textContent=error?.message||'分析未完成';status.textContent='请核对命例或模型服务配置';}
      finally{button.disabled=false}
    }
    button.addEventListener('click',send);
    question.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter')send()});
  </script>
</body>
</html>
